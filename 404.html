<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Preserve the path: lzwjava.github.io/<path> -> lzwjava.com/<path>
    var target = "https://lzwjava.com" + location.pathname + location.search;
    document.write('<link rel="canonical" href="' + target + '">');
    document.write('<meta http-equiv="refresh" content="0; url=' + target + '">');
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Moved to <a id="redirect-link" href="https://lzwjava.com/">lzwjava.com</a>.</p>
  <script>
    document.getElementById("redirect-link").href = target;
  </script>
</body>
</html>
